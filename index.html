<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业报告 · Web端</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:#f0f2f5;color:#1a1a2e;line-height:1.6;
  }

  .layout{display:flex;height:100vh;overflow:hidden}

  /* ===== 左侧菜单 ===== */
  .sidebar{
    width:232px;flex-shrink:0;background:#fff;
    border-right:1px solid #eef0f4;display:flex;flex-direction:column;
  }
  .sidebar-brand{padding:22px 20px 16px;border-bottom:1px solid #f0f2f5}
  .sidebar-brand .brand-title{font-size:17px;font-weight:700;color:#1a1a2e;display:flex;align-items:center;gap:8px}
  .sidebar-brand .brand-title .logo{
    width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1a73e8,#0d47a1);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
  }
  .sidebar-brand .brand-sub{font-size:12px;color:#98a2b3;margin-top:5px;padding-left:38px}

  .sidebar-nav{flex:1;overflow-y:auto;padding:12px 12px}
  .sidebar-nav .nav-group-label{font-size:11px;color:#98a2b3;font-weight:600;padding:8px 12px 6px;letter-spacing:.5px}
  .menu-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;
    font-size:14px;color:#344054;cursor:pointer;transition:all .15s;position:relative;
    margin-bottom:2px;user-select:none;
  }
  .menu-item:hover{background:#f2f4f7}
  .menu-item .mi-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
  .menu-item.active{background:#e8f0fe;color:#1a73e8;font-weight:600}
  .menu-item.active::before{
    content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
    background:#1a73e8;border-radius:0 3px 3px 0;
  }

  .sidebar-footer{padding:14px 20px;border-top:1px solid #f0f2f5;font-size:12px;color:#98a2b3}

  /* ===== 主内容区 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .main-header{
    height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid #eef0f4;
    display:flex;align-items:center;gap:12px;padding:0 24px;
  }
  .main-header .main-title{font-size:16px;font-weight:700;color:#1a1a2e}
  .main-header .main-meta{font-size:12px;color:#98a2b3;margin-left:auto}

  .main-content{flex:1;overflow:hidden;position:relative}
  .main-content .page{height:100%;overflow:auto}

  /* 作文报告 iframe */
  .essay-frame{width:100%;height:100%;border:none;display:block;background:#f0f2f5}

  /* 占位页面 */
  .placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
  .placeholder .ph-card{
    background:#fff;border:1px solid #eef0f4;border-radius:12px;padding:48px 56px;
    text-align:center;max-width:420px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .placeholder .ph-icon{font-size:46px;line-height:1;margin-bottom:16px}
  .placeholder .ph-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px}
  .placeholder .ph-desc{font-size:13px;color:#667085;margin-bottom:20px}
  .placeholder .ph-hint{
    display:inline-block;font-size:12px;color:#1a73e8;background:#e8f0fe;
    padding:5px 14px;border-radius:999px;font-weight:500;
  }
</style>
</head>
<body>
<div class="layout">
  <!-- 左侧菜单 -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-title"><span class="logo">✏️</span>作业报告</div>
      <div class="brand-sub">高三 · 语文 · 2026年7月月考</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group-label">报告中心</div>
      <div class="menu-item" data-page="overview"><span class="mi-icon">📊</span>作业总览</div>
      <div class="menu-item" data-page="analysis"><span class="mi-icon">📈</span>成绩分析</div>
      <div class="menu-item" data-page="review"><span class="mi-icon">🎯</span>试题讲评</div>
      <div class="menu-item active" data-page="essay"><span class="mi-icon">✏️</span>作文报告</div>
      <div class="menu-item" data-page="knowledge"><span class="mi-icon">📚</span>知识点分析</div>
    </nav>
    <div class="sidebar-footer">Web端报告原型</div>
  </aside>

  <!-- 主内容区 -->
  <div class="main">
    <header class="main-header">
      <span class="main-title" id="pageTitle">✏️ 作文报告</span>
      <span class="main-meta" id="pageMeta">AI 作文批改报告</span>
    </header>
    <div class="main-content" id="mainContent"></div>
  </div>
</div>

<script>
  // 调试开关：index.html?noDims=1 会把参数透传给内嵌的作文报告，预览「未录入评分维度」样式
  const noDims = new URLSearchParams(location.search).get('noDims') === '1';
  const essaySrc = 'essay-report.html' + (noDims ? '?noDims=1' : '');

  // 各菜单页配置
  const pages = {
    overview: {
      title: '📊 作业总览',
      meta: '班级作业提交率、批改进度与得分率概览',
      html: placeholder('📊', '作业总览', '查看班级作业提交率、批改进度与各题得分率概览')
    },
    analysis: {
      title: '📈 成绩分析',
      meta: '分数段分布、各维度得分率与班级对比',
      html: placeholder('📈', '成绩分析', '分数段分布、各维度平均得分率、班级横向对比')
    },
    review: {
      title: '🎯 试题讲评',
      meta: '逐题解析、得分率与相似题推荐',
      html: placeholder('🎯', '试题讲评', '逐题解析、班级/年级得分率、常见错因与相似题推荐')
    },
    essay: {
      title: '✏️ 作文报告',
      meta: 'AI 作文批改报告',
      html: '<iframe class="essay-frame" src="' + essaySrc + '" title="作文报告"></iframe>'
    },
    knowledge: {
      title: '📚 知识点分析',
      meta: '知识点掌握度与需加强项',
      html: placeholder('📚', '知识点分析', '知识点掌握情况、班级/年级对比、需重点加强项')
    }
  };

  function placeholder(icon, title, desc) {
    return `<div class="placeholder"><div class="ph-card">
      <div class="ph-icon">${icon}</div>
      <div class="ph-title">${title}</div>
      <div class="ph-desc">${desc}</div>
      <span class="ph-hint">该模块为原型占位 · 仅展示菜单结构</span>
    </div></div>`;
  }

  const mainContent = document.getElementById('mainContent');
  const pageTitle = document.getElementById('pageTitle');
  const pageMeta = document.getElementById('pageMeta');

  function switchPage(page) {
    const cfg = pages[page];
    if (!cfg) return;
    document.querySelectorAll('.menu-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
    pageTitle.textContent = cfg.title;
    pageMeta.textContent = cfg.meta;
    mainContent.innerHTML = cfg.html;
  }

  document.querySelectorAll('.menu-item').forEach(el => {
    el.addEventListener('click', () => switchPage(el.dataset.page));
  });

  // 默认激活「作文报告」，直接展示嵌入的作文批改报告
  switchPage('essay');
</script>
</body>
</html>
